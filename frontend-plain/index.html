<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
        delete AFRAME.components["grabbable"];
    </script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.x/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/super-hands@^3.0.5/dist/super-hands.min.js"></script>
    <script src="https://unpkg.com/@tweenjs/tween.js@^23.1.3/dist/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/physx@v0.2.x/dist/physx.min.js"></script>
</head>
<body>

<a-scene id="sceneRef" stats physx="autoLoad: true; wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/physx@v0.2.x/wasm/physx.release.wasm">
    <a-assets timeout="300000">
<!--        <a-asset-item ref="carModel" id="carModel" src="assets/porsche/scene.gltf"></a-asset-item>-->
        <a-asset-item ref="minivanModel" id="minivanModel" src="assets/minivan/scene.gltf"></a-asset-item>
<!--        <a-asset-item id="nissanModel" src="assets/nissan/nissan.glb"></a-asset-item>-->
        <a-asset-item id="carWheel" src="assets/wheel/scene.gltf"></a-asset-item>
    </a-assets>

    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" physx-body></a-box>
    <a-entity width="5" height="5" position="-5 0 -5" gltf-model="#minivanModel" hoverable grabbable find-door></a-entity>
    <a-entity position="-1 -1.65 -1.5" gltf-model="#carWheel"></a-entity>
    <a-circle position="1 1.25 -1" color="pink" radius="0.45" obb-collider="showColliders: true" grabbable></a-circle>
<!--    <a-entity position="5 0 -5" gltf-model="#carModel"></a-entity>-->
<!--    <a-entity position="-10 0 -30" gltf-model="#nissanModel"></a-entity>-->

    <a-sky color="#87CEEB"></a-sky>
    <a-plane
            rotation="-90 0 0"
            width="50"
            height="50"
            color="#7BC8A4"
            src="https://upload.wikimedia.org/wikipedia/commons/6/68/Callisto_terrain.jpg"
            physx-body="type: static"
    ></a-plane>
    <a-plane
            position="50 0 -50"
            rotation="-90 0 0"
            width="500"
            height="50"
            color="#7BC8A4"
            src="https://cdn.polyhaven.com/asset_img/primary/rocky_terrain_02.png?height=760"
            physx-body="type: static"
    ></a-plane>
    <a-text
            ref="vrLogger"
            id="vrLogger"
            position="0 2 -10"
            value="Hi"
            geometry="primitive:plane"
    ></a-text>

    <a-box
            obb-collider="showColliders: true"
            position="0 1 -5"
            depth="1"
            height="1"
            width="1"
            color="#EF2D5E"
            animation="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"
            grabbable
    ></a-box>

    <a-box
            obb-collider="showColliders: true"
            hoverable
            grabbable
            stretchable
            draggable
            droppable
            color="blue"
            position="0 0.5 -1.5"
    ></a-box>

    <a-entity ref="rig" id="rig" position="0 0 0" rotation="0 0 0" progressive-controls>
        <a-camera camera wasd-control look-controls position="0 1.65 0" super-hands>
            <a-entity raycaster></a-entity>
        </a-camera>

        <a-entity
                id="leftHand"
                class="left-controller"
                sphere-collider="objects: a-box"
                super-hands
                hand-controls="hand: left"
        ></a-entity>
        <a-entity
                id="rightHand"
                class="right-controller"
                sphere-collider="objects: a-box"
                super-hands
                hand-controls="hand: right"
        ></a-entity>
    </a-entity>
</a-scene>

<script src="scenes/storybook/main.js"></script>
<script src="scenes/storybook/components/minivan-interactions.js"></script>
</body>
</html>
